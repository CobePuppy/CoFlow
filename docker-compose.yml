services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: coflow
      POSTGRES_PASSWORD: coflow_local
      POSTGRES_DB: coflow
    ports:
      - "5432:5432"
    volumes:
      - coflow_pg:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U coflow]
      interval: 5s
      retries: 10
volumes:
  coflow_pg:
